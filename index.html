
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Chấm bài Tự động</title>
    <script>
        // Defensive fix for browser extensions and system environments that try to override window.fetch
        try {
            if (typeof window !== 'undefined') {
                let currentFetch = window.fetch;
                Object.defineProperty(window, 'fetch', {
                    get() { return currentFetch; },
                    set(newFetch) { currentFetch = newFetch; },
                    configurable: true,
                    enumerable: true
                });
            }
        } catch (e) {
            console.warn("Could not patch window.fetch setter:", e);
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
